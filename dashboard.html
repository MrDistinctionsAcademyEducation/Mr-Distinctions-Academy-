<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mr Distinctions Academy - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #c3bef0 0%, #b1dbf0 50%, #f3d2fd 100%);
      min-height: 100vh;
      overflow-x: hidden;
      color: #1f2937;
    }
    .content, #tipsContent {
      transition: max-height 0.4s ease-in-out, opacity 0.4s ease-in-out;
      overflow: hidden;
    }
    .hidden {
      display: none !important;
      max-height: 0 !important;
      opacity: 0;
      padding: 0 !important;
      margin: 0 !important;
      pointer-events: none;
    }
    .visible {
      display: block !important;
      max-height: 1000px;
      opacity: 1;
      padding-top: 1rem;
      padding-bottom: 1rem;
      pointer-events: auto;
    }
    .video-box {
      border: 2px solid #3b82f6;
      border-radius: 1rem;
      box-shadow: 0 4px 6px rgba(59, 130, 246, 0.4);
      overflow: hidden;
      max-width: 100%;
      margin-bottom: 1.5rem;
    }
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 1rem;
    }
    .document-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background-color: #f8fafc;
      border-radius: 6px;
      margin-bottom: 8px;
      transition: all 0.2s;
      text-decoration: none;
      color: inherit;
    }
    .document-link:hover {
      background-color: #e2e8f0;
      transform: translateX(2px);
    }
  </style>
</head>
<body>
<section id="dashboardSection" class="min-h-screen flex flex-col">
  <header class="bg-transparent text-blue-900 py-4 px-4 container mx-auto">
    <h1 class="text-xl font-extrabold drop-shadow-md select-none">Mr Distinctions Academy</h1>
    <p class="text-sm italic mt-1 text-blue-700 select-none">"We are here to simply your academic journey"</p>
  </header>
  <main class="flex-grow container mx-auto px-4 py-10 max-w-screen-xl">
    <div id="subjects-container" class="grid grid-cols-1 md:grid-cols-2 gap-10 mb-16"></div>
    <section class="bg-white rounded-3xl shadow-2xl p-8 mt-12">
      <h2 class="text-3xl font-bold text-red-700 mb-6 border-b border-red-300 pb-3 select-none">STUDY &amp; EXAM TIPS VIDEOS</h2>
      <button id="tipsBtn" onclick="toggleTips()" class="bg-purple-700 hover:bg-purple-800 text-white font-semibold px-7 py-3 rounded-lg shadow-lg transition active:scale-95 focus:outline-none focus:ring-4 focus:ring-purple-400">
        View Tips Videos
      </button>
      <div id="tipsContent" class="hidden mt-8 space-y-10">
        <p class="text-gray-600 select-none">No tips videos currently available.</p>
      </div>
    </section>

    <div class="flex justify-end mt-6 mb-6">
      <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-3 py-1 rounded-md shadow-sm transition active:scale-95 focus:outline-none focus:ring-2 focus:ring-red-400">
        Logout
      </button>
    </div>
  </main>
  <footer class="bg-blue-800 text-white text-center py-6 mt-8 select-none shadow-inner">
    <p class="text-sm">&copy; 2025 Mr Distinctions Academy. All rights reserved.</p>
  </footer>
</section>

<script>
  const subjects = ['English Language', 'Mathematics', 'Chemistry', 'Physics', 'Biology'];
  const username = 'mrdistinctionsacademyeducation';
  const repo = 'Mr-Distinctions-Academy-';
  const container = document.getElementById('subjects-container');

  function handleLogout() {
    window.location.href = 'index.html';
  }

  function toggleContent(button) {
    const content = button.nextElementSibling;
    content.classList.toggle('hidden');
    content.classList.toggle('visible');
  }

  function toggleTips() {
    const tipsContent = document.getElementById('tipsContent');
    tipsContent.classList.toggle('hidden');
    tipsContent.classList.toggle('visible');
  }

  async function fetchFromGitHub(folder, filterFn) {
    const url = `https://api.github.com/repos/${username}/${repo}/contents/${folder}`;
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Failed to fetch: ${response.statusText}`);
      const files = await response.json();
      return files.filter(filterFn);
    } catch {
      return [];
    }
  }

  async function fetchVideoLinks(subject) {
    const path = `${subject.toLowerCase().replace(/ /g, '-')}/videos`;
    const files = await fetchFromGitHub(path, file => file.name.endsWith('.html'));
    const links = [];
    for (const file of files) {
      try {
        const res = await fetch(file.download_url);
        const text = await res.text();
        // updated regex to match youtube.com and youtu.be links:
        const match = text.match(/https?:\/\/(www\.)?(youtube\.com\/watch\?v=|youtu\.be\/)[\w-]+/);
        if (match) links.push(match[0]);
      } catch {}
    }
    return links;
  }

  async function fetchDocuments(subject) {
    const path = `${subject.toLowerCase().replace(/ /g, '-')}/documents`;
    const files = await fetchFromGitHub(path, file => file.name.endsWith('.pdf') || file.name.endsWith('.docx'));
    return files.map(file =>
      `<a href="${file.download_url}" target="_blank" class="document-link">📄 ${file.name}</a>`
    );
  }

  async function fetchQuizzes(subject) {
    const path = `${subject.toLowerCase().replace(/ /g, '-')}/quiz`;
    const files = await fetchFromGitHub(path, file => file.name.endsWith('.html'));
    return files.map(file =>
      `<a href="${file.html_url}" target="_blank" class="document-link">📝 ${file.name}</a>`
    );
  }

  async function initializeDashboard() {
    container.innerHTML = '';
    for (const subject of subjects) {
      const section = document.createElement('section');
      section.className = 'bg-white rounded-3xl shadow-2xl p-6';

      // Fetch videos dynamically from GitHub
      const videoLinks = await fetchVideoLinks(subject);
      const videosContent = videoLinks.length
        ? videoLinks.map(link => `
            <div class="video-box">
              <div class="video-wrapper">
                <iframe src="https://www.youtube.com/embed/${new URL(link).searchParams.get('v')}" allowfullscreen></iframe>
              </div>
            </div>
          `).join('')
        : `<p class="text-gray-600 select-none">Video content coming soon.</p>`;

      // Fetch documents dynamically
      const documents = await fetchDocuments(subject);

      // Fetch quizzes dynamically except English Language (hardcoded)
      let quizContent = '';
      if (subject === 'English Language') {
        quizContent = `<a href="https://mrdistinctionsacademyeducation.github.io/Mr-Distinctions-Academy-/quiz/english-quiz.html" class="text-green-600 underline text-sm block mt-2 hover:text-green-800">Start Now</a>`;
      } else {
        const quizzes = await fetchQuizzes(subject);
        quizContent = quizzes.length
          ? quizzes.join('')
          : '<p class="text-gray-600 select-none">No quizzes available yet.</p>';
      }

      section.innerHTML = `
        <h2 class="text-3xl font-bold text-red-700 mb-6 border-b border-red-300 pb-2 select-none">${subject}</h2>

        <div class="bg-blue-50 p-4 rounded-xl border border-blue-300 mb-6">
          <h3 class="text-xl font-semibold text-blue-700 mb-3 select-none">🎥 Video Lessons</h3>
          <button onclick="toggleContent(this)" class="bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded-md shadow-md transition focus:outline-none">
            View Videos
          </button>
          <div class="content hidden">
            ${videosContent}
          </div>
        </div>

        <div class="bg-purple-50 p-4 rounded-xl border border-purple-300 mb-6">
          <h3 class="text-xl font-semibold text-purple-700 mb-3 select-none">📄 Documents</h3>
          <button onclick="toggleContent(this)" class="bg-purple-700 hover:bg-purple-800 text-white px-4 py-2 rounded-md shadow-md transition focus:outline-none">
            View Documents
          </button>
          <div class="content hidden mt-4">
            <p class="text-gray-600 select-none mb-2">Download and read helpful study materials:</p>
            ${
              documents.length
                ? documents.join('')
                : '<p class="text-gray-600 select-none">No documents uploaded yet.</p>'
            }
          </div>
        </div>

        <div class="bg-green-50 p-4 rounded-xl border border-green-300">
          <h3 class="text-xl font-semibold text-green-700 mb-3 select-none">📝 Exam Quiz Questions</h3>
          <button onclick="toggleContent(this)" class="bg-green-700 hover:bg-green-800 text-white px-4 py-2 rounded-md shadow-md transition focus:outline-none">
            View Exam Quiz Questions
          </button>
          <div class="content hidden mt-4">
            <p class="text-gray-600 select-none">Test your knowledge with exam quiz questions.</p>
            ${quizContent}
          </div>
        </div>
      `;

      container.appendChild(section);
    }
  }

  window.addEventListener('DOMContentLoaded', initializeDashboard);
</script>
</body>
</html>
