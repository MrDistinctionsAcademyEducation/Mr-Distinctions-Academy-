<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mr Distinctions Academy - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #c3bef0 0%, #b1dbf0 50%, #f3d2fd 100%);
      min-height: 100vh;
      overflow-x: hidden;
      color: #1f2937;
    }
    .content, #tipsContent {
      transition: max-height 0.4s ease-in-out, opacity 0.4s ease-in-out;
      overflow: hidden;
    }
    .hidden {
      display: none !important;
      max-height: 0 !important;
      opacity: 0;
      pointer-events: none;
    }
    .visible {
      display: block !important;
      max-height: 1000px;
      opacity: 1;
      padding-top: 1rem;
      padding-bottom: 1rem;
      pointer-events: auto;
    }
    iframe {
      border-radius: 1rem;
      width: 100%;
      height: 315px;
      margin-bottom: 1rem;
    }
    .document-link {
      display: block;
      margin-bottom: 0.5rem;
      padding: 10px;
      background: #f3f4f6;
      border-left: 4px solid #3b82f6;
      border-radius: 8px;
      text-decoration: none;
      color: #1f2937;
      font-weight: 500;
      transition: background 0.2s;
    }
    .document-link:hover {
      background: #e0e7ff;
    }
  </style>
</head>
<body>

  <header class="bg-white shadow p-4 text-center">
    <h1 class="text-3xl font-bold text-blue-800">Mr Distinctions Academy</h1>
    <p class="text-sm italic text-blue-600">"We are here to simplify your academic journey"</p>
  </header>

  <main class="p-6 max-w-6xl mx-auto space-y-16">
    <div id="subjects-container" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>

    <section class="bg-white p-6 rounded-2xl shadow-xl">
      <h2 class="text-2xl font-bold text-purple-700 mb-4">🎓 Study & Exam Tips</h2>
      <button onclick="toggleTips()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg mb-4">
        View Tips Videos
      </button>
      <div id="tipsContent" class="hidden">
        <p class="text-gray-600">No tips available yet. Stay tuned!</p>
      </div>
    </section>
  </main>

  <footer class="bg-blue-800 text-white text-center py-4 mt-12">
    <p class="text-sm">&copy; 2025 Mr Distinctions Academy. All rights reserved.</p>
  </footer>

<script>
  const subjects = ['EnglishLanguage', 'Mathematics', 'Chemistry', 'Physics', 'Biology'];

  function toggleContent(button) {
    const content = button.nextElementSibling;
    content.classList.toggle('hidden');
    content.classList.toggle('visible');
  }

  function toggleTips() {
    const tipsContent = document.getElementById('tipsContent');
    tipsContent.classList.toggle('hidden');
    tipsContent.classList.toggle('visible');
  }

  async function loadSectionContent(subject, type) {
    const url = `${subject}/${type}.html`;
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error('File not found');
      return await response.text();
    } catch {
      return `<p class="text-sm text-gray-400 italic">No ${type} available yet.</p>`;
    }
  }

  async function createSubjectSection(subject) {
    const container = document.getElementById('subjects-container');

    const section = document.createElement('section');
    section.className = 'bg-white p-6 rounded-2xl shadow-lg';

    const videoContent = await loadSectionContent(subject, 'videos');
    const documentContent = await loadSectionContent(subject, 'documents');
    const quizContent = await loadSectionContent(subject, 'quizzes');

    section.innerHTML = `
      <h2 class="text-2xl font-bold text-red-700 mb-4">${subject.replace(/([A-Z])/g, ' $1').trim()}</h2>

      <div class="mb-6">
        <h3 class="text-xl text-blue-700 font-semibold mb-2">🎥 Video Lessons</h3>
        <button onclick="toggleContent(this)" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded mb-2">
          View Videos
        </button>
        <div class="content hidden">${videoContent}</div>
      </div>

      <div class="mb-6">
        <h3 class="text-xl text-purple-700 font-semibold mb-2">📄 Documents</h3>
        <button onclick="toggleContent(this)" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded mb-2">
          View Documents
        </button>
        <div class="content hidden">${documentContent}</div>
      </div>

      <div>
        <h3 class="text-xl text-green-700 font-semibold mb-2">📝 Exam Quiz Questions</h3>
        <button onclick="toggleContent(this)" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded mb-2">
          View Quizzes
        </button>
        <div class="content hidden">${quizContent}</div>
      </div>
    `;

    container.appendChild(section);
  }

  window.addEventListener('DOMContentLoaded', () => {
    subjects.forEach(subject => createSubjectSection(subject));
  });
</script>

</body>
</html>
