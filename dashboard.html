<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mr Distinctions Academy - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #c3bef0 0%, #b1dbf0 50%, #f3d2fd 100%);
      min-height: 100vh;
      overflow-x: hidden;
      color: #1f2937;
    }
    .content, #tipsContent {
      transition: max-height 0.4s ease-in-out, opacity 0.4s ease-in-out;
      overflow: hidden;
    }
    .hidden {
      display: none !important;
      max-height: 0 !important;
      opacity: 0;
      pointer-events: none;
    }
    .visible {
      display: block !important;
      max-height: 1000px;
      opacity: 1;
      padding-top: 1rem;
      padding-bottom: 1rem;
      pointer-events: auto;
    }
    .document-link {
      display: block;
      margin-bottom: 0.5rem;
      padding: 10px;
      background: #f3f4f6;
      border-left: 4px solid #3b82f6;
      border-radius: 8px;
      text-decoration: none;
      color: #1f2937;
      font-weight: 500;
      transition: background 0.2s;
    }
    .document-link:hover {
      background: #e0e7ff;
    }
    .quiz-button {
      background-color: #10b981;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .quiz-button:hover {
      background-color: #059669;
    }
  </style>
</head>
<body>

  <header class="bg-white shadow p-4 text-center">
    <h1 class="text-3xl font-bold text-blue-800">Mr Distinctions Academy</h1>
    <p class="text-sm italic text-blue-600">"We are here to simplify your academic journey"</p>
  </header>

  <main class="p-6 max-w-6xl mx-auto space-y-16">
    <div id="subjects-container" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>

    <section class="bg-white p-6 rounded-2xl shadow-xl">
      <h2 class="text-2xl font-bold text-purple-700 mb-4">🎓 Study & Exam Tips</h2>
      <button onclick="toggleTips()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg mb-4">
        View Tips Videos
      </button>
      <div id="tipsContent" class="hidden">
        <p class="text-gray-600 mb-4">Loading tips...</p>
      </div>
    </section>
  </main>

  <footer class="bg-blue-800 text-white text-center py-4 mt-12">
    <p class="text-sm">&copy; 2025 Mr Distinctions Academy. All rights reserved.</p>
  </footer>

<script>
  const subjects = ['EnglishLanguage', 'Mathematics', 'Chemistry', 'Physics', 'Biology'];

  function toggleContent(button) {
    const content = button.nextElementSibling;
    content.classList.toggle('hidden');
    content.classList.toggle('visible');
  }

  async function toggleTips() {
    const tipsContent = document.getElementById('tipsContent');

    if (tipsContent.classList.contains('hidden')) {
      if (!tipsContent.dataset.loaded) {
        try {
          const response = await fetch('study-tips.html');
          const content = await response.text();
          tipsContent.innerHTML = content;
          tipsContent.dataset.loaded = 'true';
        } catch {
          tipsContent.innerHTML = '<p class="text-sm text-red-500 italic">Failed to load study tips.</p>';
        }
      }
    }

    tipsContent.classList.toggle('hidden');
    tipsContent.classList.toggle('visible');
  }

  async function loadSectionContent(subject, type) {
    const url = `${subject}/${type}.html`;
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error('File not found');
      let text = await response.text();

      const wrapper = document.createElement('div');
      wrapper.innerHTML = text;

      if (type === 'documents') {
        const heading = document.createElement('h4');
        heading.className = 'text-lg font-semibold text-gray-700 mb-3';
        heading.textContent = '📘 Exam Made Easy Pamphlets';
        wrapper.prepend(heading);

        const links = wrapper.querySelectorAll('a');
        links.forEach(link => {
          link.setAttribute('target', '_blank');
        });

        return wrapper.innerHTML;
      }

      if (type === 'quizzes') {
        const quizLinks = wrapper.querySelectorAll('a');
        const quizList = document.createElement('div');

        if (quizLinks.length === 0) {
          return `<p class="text-sm text-gray-400 italic">No quizzes available yet.</p>`;
        }

        quizLinks.forEach(link => {
          const quizName = link.textContent.trim();
          const quizURL = link.getAttribute('href');

          const div = document.createElement('div');
          div.className = 'mb-4 p-4 bg-gray-50 rounded shadow';

          div.innerHTML = `
            <p class="text-md font-medium text-gray-800 mb-2">${quizName}</p>
            <button class="quiz-button" onclick="loadQuiz('${subject}', '${quizURL}', this)">Start Now</button>
            <div class="quiz-placeholder mt-4 text-sm text-gray-600"></div>
          `;

          quizList.appendChild(div);
        });

        return quizList.innerHTML;
      }

      return wrapper.innerHTML;
    } catch {
      return `<p class="text-sm text-gray-400 italic">No ${type} available yet.</p>`;
    }
  }

  async function loadQuiz(subject, quizFile, button) {
    const placeholder = button.nextElementSibling;
    placeholder.innerHTML = 'Loading quiz...';

    try {
      const res = await fetch(`${subject}/${quizFile}`);
      if (!res.ok) throw new Error('Failed to load quiz');
      const quizHTML = await res.text();
      placeholder.innerHTML = quizHTML;
    } catch {
      placeholder.innerHTML = '<p class="text-red-500">Could not load this quiz.</p>';
    }
  }

  async function createSubjectSection(subject) {
    const container = document.getElementById('subjects-container');

    const section = document.createElement('section');
    section.className = 'bg-white p-6 rounded-2xl shadow-lg';

    const videoContent = await loadSectionContent(subject, 'videos');
    const documentContent = await loadSectionContent(subject, 'documents');
    const quizContent = await loadSectionContent(subject, 'quizzes');

    section.innerHTML = `
      <h2 class="text-2xl font-bold text-red-700 mb-4">${subject.replace(/([A-Z])/g, ' $1').trim()}</h2>

      <div class="mb-6">
        <h3 class="text-xl text-blue-700 font-semibold mb-2">🎥 Video Lessons</h3>
        <button onclick="toggleContent(this)" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded mb-2">
          View Videos
        </button>
        <div class="content hidden">${videoContent}</div>
      </div>

      <div class="mb-6">
        <h3 class="text-xl text-purple-700 font-semibold mb-2">📄 Documents</h3>
        <button onclick="toggleContent(this)" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded mb-2">
          View Documents
        </button>
        <div class="content hidden">${documentContent}</div>
      </div>

      <div>
        <h3 class="text-xl text-green-700 font-semibold mb-2">📝 Exam Quiz Questions</h3>
        <button onclick="toggleContent(this)" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded mb-2">
          View Quizzes
        </button>
        <div class="content hidden">${quizContent}</div>
      </div>
    `;

    container.appendChild(section);
  }

  window.addEventListener('DOMContentLoaded', () => {
    subjects.forEach(subject => createSubjectSection(subject));
  });
</script>

</body>
</html>
