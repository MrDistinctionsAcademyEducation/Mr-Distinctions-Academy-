<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mr Distinctions Academy - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #c3bef0 0%, #b1dbf0 50%, #f3d2fd 100%);
      min-height: 100vh;
      overflow-x: hidden;
      color: #1f2937;
    }
    .content, #tipsContent {
      transition: max-height 0.4s ease-in-out, opacity 0.4s ease-in-out;
      overflow: hidden;
    }
    .hidden {
      display: none !important;
      max-height: 0 !important;
      opacity: 0;
      pointer-events: none;
    }
    .visible {
      display: block !important;
      max-height: 1000px;
      opacity: 1;
      padding-top: 1rem;
      padding-bottom: 1rem;
      pointer-events: auto;
    }
    iframe {
      border-radius: 1rem;
      width: 100%;
      height: 315px;
      margin-bottom: 1rem;
    }
    .document-link {
      display: block;
      margin-bottom: 0.5rem;
      padding: 10px;
      background: #f3f4f6;
      border-left: 4px solid #3b82f6;
      border-radius: 8px;
      text-decoration: none;
      color: #1f2937;
      font-weight: 500;
      transition: background 0.2s;
    }
    .document-link:hover {
      background: #e0e7ff;
    }
  </style>
</head>
<body>

  <header class="bg-white shadow p-4 text-center">
    <h1 class="text-3xl font-bold text-blue-800">Mr Distinctions Academy</h1>
    <p class="text-sm italic text-blue-600">"We are here to simplify your academic journey"</p>
  </header>

  <main class="p-6 max-w-6xl mx-auto space-y-16">
    <div id="subjects-container" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>

    <section class="bg-white p-6 rounded-2xl shadow-xl">
      <h2 class="text-2xl font-bold text-purple-700 mb-4">🎓 Study & Exam Tips</h2>
      <button onclick="toggleTips()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg mb-4">
        View Tips Videos
      </button>
      <div id="tipsContent" class="hidden">
        <p class="text-gray-600">No tips available yet. Stay tuned!</p>
      </div>
    </section>
  </main>

  <footer class="bg-blue-800 text-white text-center py-4 mt-12">
    <p class="text-sm">&copy; 2025 Mr Distinctions Academy. All rights reserved.</p>
  </footer>

<script>
  // Subjects and GitHub repo base
  const subjects = ['EnglishLanguage', 'Mathematics', 'Chemistry', 'Physics', 'Biology'];
  const githubApiBase = 'https://api.github.com/repos/kaundapascal/mrdistinctions-academy/contents';

  function toggleContent(button) {
    const content = button.nextElementSibling;
    content.classList.toggle('hidden');
    content.classList.toggle('visible');
  }

  function toggleTips() {
    const tipsContent = document.getElementById('tipsContent');
    tipsContent.classList.toggle('hidden');
    tipsContent.classList.toggle('visible');
  }

  // Helper: Categorize file by name
  function getFileType(name) {
    const n = name.toLowerCase();
    if (n.includes('video')) return 'videos';
    if (n.includes('quiz') || n.includes('question')) return 'quizzes';
    if (n.match(/\.(pdf|doc|docx|txt|note)/) || n.includes('document')) return 'documents';
    if (n.endsWith('.mp4') || n.endsWith('.webm') || n.endsWith('.mov')) return 'videos';
    if (n.endsWith('.html')) {
      if (n.includes('video')) return 'videos';
      if (n.includes('quiz')) return 'quizzes';
      if (n.includes('document')) return 'documents';
    }
    return null;
  }

  // Helper: Clean display name
  function cleanFileName(name) {
    return name.replace(/[_\-]/g, ' ').replace(/\.[^/.]+$/, '').replace(/\b(?:videos?|documents?|quizzes?)\b/gi, '').trim();
  }

  // Render a file as a link/button
  function renderFile(file) {
    let url = file.download_url || file.html_url;
    if (file.name.endsWith('.html')) {
      // Use GitHub Pages for HTML resources
      url = `https://kaundapascal.github.io/mrdistinctions-academy/${file.path}`;
    }
    return `<a class="document-link" href="${url}" target="_blank">${cleanFileName(file.name)}</a>`;
  }

  // Fetch subject folder contents from GitHub
  async function fetchSubjectFiles(subject) {
    try {
      const res = await fetch(`${githubApiBase}/${subject}`);
      if (!res.ok) return [];
      return await res.json();
    } catch {
      return [];
    }
  }

  // Create subject section, grouping links by type
  async function createSubjectSection(subject) {
    const container = document.getElementById('subjects-container');
    const section = document.createElement('section');
    section.className = 'bg-white p-6 rounded-2xl shadow-lg';

    // Fetch all subject files in the folder
    const files = await fetchSubjectFiles(subject);

    // Group by type
    const groups = { videos: [], documents: [], quizzes: [] };
    files.forEach(file => {
      const type = getFileType(file.name);
      if (type && groups[type]) groups[type].push(file);
    });

    // UI sections
    function renderSection(label, icon, color, type) {
      return `
      <div class="mb-6">
        <h3 class="text-xl text-${color}-700 font-semibold mb-2">${icon} ${label}</h3>
        <button onclick="toggleContent(this)" class="bg-${color}-600 hover:bg-${color}-700 text-white px-3 py-2 rounded mb-2">
          View ${label}
        </button>
        <div class="content hidden">
          ${
            groups[type].length
              ? groups[type].map(renderFile).join('')
              : `<p class="text-sm text-gray-400 italic">No ${label.toLowerCase()} found yet.</p>`
          }
        </div>
      </div>`;
    }

    section.innerHTML = `
      <h2 class="text-2xl font-bold text-red-700 mb-4">${subject.replace(/([A-Z])/g, ' $1').trim()}</h2>
      ${renderSection('Video Lessons', '🎥', 'blue', 'videos')}
      ${renderSection('Documents', '📄', 'purple', 'documents')}
      ${renderSection('Exam Quiz Questions', '📝', 'green', 'quizzes')}
    `;

    container.appendChild(section);
  }

  window.addEventListener('DOMContentLoaded', () => {
    subjects.forEach(subject => createSubjectSection(subject));
  });
</script>

</body>
  </html>
